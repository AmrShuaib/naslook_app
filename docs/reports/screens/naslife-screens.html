<style>
  /* التخطيط: معرض هواتف في ثلاث مجموعات، كل هاتف شاشة حقيقية ببيانات من الموقع الحي. ألوان الشعار والأبيض غالب. */
  :root {

    --font-display: 'Baloo Bhaijaan 2', 'Rubik', system-ui, sans-serif; --font-body: 'Rubik', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101317; --surface: #191D23; --fg: #E8EBEF; --muted: #9AA2AD; --line: #2A3038; --blue: #4C9BFF; --frame: #3A414B; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #101317; --surface: #191D23; --fg: #E8EBEF; --muted: #9AA2AD; --line: #2A3038; --blue: #4C9BFF; --frame: #3A414B; color-scheme: dark; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); direction: rtl; line-height: 1.65; font-size: 15px; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 36px; }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.25; text-wrap: balance; }
  h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; } h2 { font-size: 24px; font-weight: 800; }
  p { margin: 0; } .lead { color: var(--muted); max-width: 66ch; font-size: 16px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; }
  .fact { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; font-size: 13px; }
  .fact b { color: var(--blue); }
  section { display: grid; gap: 16px; }
  .sec p { color: var(--muted); }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 26px 18px; justify-items: center; }
  figure { margin: 0; display: grid; gap: 10px; justify-items: center; width: 100%; max-width: 300px; }
  figcaption { text-align: center; display: grid; gap: 2px; }
  figcaption b { font-family: var(--font-display); font-size: 17px; }
  figcaption span { color: var(--muted); font-size: 13px; }
  .src { font-size: 11.5px; padding: 1px 9px; border-radius: 999px; justify-self: center; }
  .src.real { background: #E5F6EC; color: #14703A; } .src.ex { background: #FFF4D6; color: #7A5200; }

  .phone { width: 280px; height: 580px; max-width: 100%; padding: 8px; border-radius: 40px; background: var(--frame); box-shadow: 0 22px 44px -26px rgba(0,0,0,.5); }
  .app { position: relative; height: 100%; border-radius: 32px; overflow: hidden; background: var(--a-bg); color: var(--a-fg); font-size: 12px; line-height: 1.5; display: flex; flex-direction: column; }
  .app * { box-sizing: border-box; }
  .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 80px; height: 19px; border-radius: 12px; background: #000; z-index: 30; }
  .body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 36px 14px 12px; display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: max-content; gap: 10px; align-content: start; }
  .body::-webkit-scrollbar, .hs::-webkit-scrollbar { display: none; }
  .body.flush { padding: 0 0 12px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .top b { font-family: var(--font-display); font-size: 19px; font-weight: 800; }
  .back { width: 30px; height: 30px; border-radius: 50%; background: var(--a-soft); display: grid; place-items: center; font-size: 15px; flex: none; }
  .mut { color: var(--a-muted); } .sm { font-size: 11px; }
  .btn { height: 40px; border-radius: 13px; background: var(--a-blue); color: #fff; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.ghost { background: var(--a-blue-soft); color: var(--a-blue); } .btn.line { background: #fff; color: var(--a-fg); border: 1px solid var(--a-line); } .btn.sm { height: 32px; font-size: 12px; padding: 0 14px; border-radius: 10px; }
  .field { height: 42px; border-radius: 13px; background: var(--a-soft); display: flex; align-items: center; padding-inline: 13px; color: var(--a-muted); }
  .hs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; border: 1px solid var(--a-line); border-radius: 999px; padding: 4px 11px; font-weight: 500; font-size: 11.5px; background: #fff; }
  .chip.on { background: var(--a-blue); border-color: var(--a-blue); color: #fff; }
  .pill { font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .p-g { background: var(--a-green-soft); color: #14703A; } .p-y { background: var(--a-yellow-soft); color: #7A5200; } .p-r { background: var(--a-red-soft); color: #B02A1D; } .p-b { background: var(--a-blue-soft); color: #0B4FA8; } .p-n { background: var(--a-soft); color: var(--a-muted); }
  .card { border: 1px solid var(--a-line); border-radius: 16px; overflow: hidden; background: #fff; }
  .card img.m { width: 100%; height: 150px; object-fit: cover; display: block; }
  .cb { padding: 9px 11px 11px; display: grid; gap: 3px; }
  .ttl { font-weight: 700; font-size: 13.5px; line-height: 1.4; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .price { font-weight: 700; font-variant-numeric: tabular-nums; }
  .logo { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; }
  .logo.r { border-radius: 50%; } .logo.lg { width: 60px; height: 60px; border-radius: 18px; font-size: 22px; }
  .li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--a-line); }
  .li:last-child { border-bottom: 0; } .li > div { flex: 1; min-width: 0; } .li b { display: block; font-size: 12.5px; }
  .li small { display: block; color: var(--a-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .g img { width: 100%; aspect-ratio: 1 / 1; max-width: 100%; object-fit: cover; border-radius: 13px; display: block; }

  .pad { padding: 0 14px; display: grid; gap: 10px; }

  .sticky .btn { flex: 1; }
  .nav { flex: none; height: 56px; border-top: 1px solid var(--a-line); display: grid; grid-template-columns: 1fr 1fr 52px 1fr 1fr; align-items: center; background: #fff; font-size: 10px; color: var(--a-muted); text-align: center; }
  .nav .on { color: var(--a-blue); font-weight: 700; } .nav i { display: block; font-style: normal; font-size: 16px; line-height: 1.2; }
  .nav .plus { justify-self: center; width: 42px; height: 42px; border-radius: 15px; background: var(--a-blue); color: #fff; font-size: 24px; display: grid; place-items: center; }
  .note { background: var(--a-yellow-soft); color: #7A5200; border-radius: 12px; padding: 8px 10px; font-size: 11px; }
  .sect { font-weight: 700; font-size: 13px; margin-top: 4px; }
  /* العارض */
  .viewer { position: relative; flex: 1; min-height: 0; background: #000; color: #fff; }
  .viewer img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .viewer .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 25%, transparent 45%, rgba(0,0,0,.8)); }
  .vbar { position: absolute; top: 32px; inset-inline: 12px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); } .vbar i { display: block; width: 45%; height: 100%; background: #fff; border-radius: 2px; }
  .vinfo { position: absolute; right: 12px; left: 56px; bottom: 62px; display: grid; gap: 2px; }
  .vrail { position: absolute; left: 10px; bottom: 70px; display: grid; gap: 10px; font-size: 10px; text-align: center; }
  .vrail span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.2); font-size: 15px; }
  .vact { position: absolute; inset-inline: 12px; bottom: 12px; }
  .dim { position: absolute; inset: 0; background: rgba(37,39,42,.45); }
  .sheet { position: absolute; inset-inline: 0; bottom: 0; background: #fff; color: var(--a-fg); border-radius: 22px 22px 0 0; padding: 10px 14px 14px; display: grid; gap: 9px; }
  .grab { justify-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--a-line); }

  .bub { max-width: 78%; padding: 7px 11px; border-radius: 16px; font-size: 12.5px; }
  .bub.me { justify-self: start; background: var(--a-blue); color: #fff; border-end-start-radius: 5px; }
  .bub.you { justify-self: end; background: var(--a-soft); border-end-end-radius: 5px; }
  .mcard { justify-self: end; width: 86%; border: 1px solid var(--a-line); border-radius: 16px; padding: 10px; display: grid; gap: 7px; }
  .composer { flex: none; padding: 8px 12px 12px; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--a-line); }
  .composer .field { flex: 1; height: 38px; border-radius: 19px; } .send { width: 38px; height: 38px; border-radius: 50%; background: var(--a-blue); color: #fff; display: grid; place-items: center; }
  .tog { width: 38px; height: 22px; border-radius: 11px; background: var(--a-line); position: relative; flex: none; } .tog::after { content: ""; position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .tog.on { background: var(--a-green); } .tog.on::after { right: auto; left: 2px; }
  .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 16px; flex: none; }
  .stat { text-align: center; } .stat b { display: block; font-family: var(--font-display); font-size: 18px; line-height: 1.1; }

    '<div class="sect">دوائر</div><div>' + C.filter(function (c) { return c.cat === 'cafe'; }).slice(0, 4).map(function (c) { return '<div class="li">' + logo(c) + '<div><b>' + c.name + (c.verified ? ' <span class="pill p-g">موثّقة ✓</span>' : '') + '</b><small>' + c.address + '</small></div><span class="btn sm ghost">انضم</span></div>'; }).join('') + '</div>' +
    '<div class="sect">في السوق</div><div>' + L.filter(function (x) { return x.cat === 'coffee' || x.cat === 'food'; }).slice(0, 3).map(function (x) { return '<div class="li"><img class="thumb" src="' + x.img + '" alt=""><div><b>' + x.title + '</b><small>' + x.seller + ' · ' + x.city + '</small></div><span class="price">' + sar(x.price) + '</span></div>'; }).join('') + '</div></div>' + nav(-1));

  // 4) عارض اللحظة + ورقة الشراء
  var v = L[0];
  phone('r2', 'اللحظة وزر الفعل', 'الزر الأزرق على اللحظة نفسها', true,

  phone('r2', 'ورقة الشراء', 'تفتح فوق اللحظة، والدفع بزر عليه المبلغ', true,

    '<div><div class="mut sm">الدفع</div><div class="hs" style="margin-top:4px"><span class="opt on">محفظتي</span><span class="opt">عند الاستلام</span></div></div>' +

  // 5) صفحة الدائرة

    '<div>' + D.brew.items.map(function (i) { return '<div class="li"><div><b>' + i.t + '</b><small>' + (i.d || ' ') + '</small></div><span class="price">' + sar(i.p) + '</span></div>'; }).join('') + '</div>' +

  // 6) صفحة المنتج

  // 7) الفعالية
  phone('r2', 'صفحة الفعالية', 'التذكرة ولمن تشتريها', false,

    '<div class="ttl" style="font-size:16px">ليلة جاز في البلد</div><div class="li" style="padding:0;border:0"><span class="logo" style="background:#3F51B5">د</span><div><b>دائرة البلد الثقافية <span class="pill p-g">موثّقة ✓</span></b><small>البلد، جدة التاريخية</small></div></div>' +

    '<div class="sect">رايحين سوا</div><div class="hs"><span class="logo r" style="background:#E46A8B;width:34px;height:34px">ن</span><span class="logo r" style="background:#6B8BE4;width:34px;height:34px">س</span><span class="mut sm" style="align-self:center">نورة وسارة معهما تذاكر</span></div>' +

  // 8) النشر
  phone('r2', 'انشر', 'شاشة واحدة لكل ما تنشره', false,

    '<div class="sect">من يراه؟</div><div class="hs"><span class="opt on">أصحابي</span><span class="opt">الجميع</span></div>' +
    '<div class="li" style="border:1px solid var(--a-line);border-radius:14px;padding:9px 11px"><span class="ic" style="background:var(--a-blue-soft)">📍</span><div><b>حي الروضة، جدة</b><small>يظهر على الخريطة هنا</small></div><span class="mut">‹</span></div>' +
    '<div class="li" style="border:1px solid var(--a-line);border-radius:14px;padding:9px 11px"><span class="ic" style="background:var(--a-yellow-soft)">⚡</span><div><b>زر الفعل</b><small>بلا زر · اضغط لتربطه بمنتج أو عرض</small></div><span class="mut">‹</span></div></div>' +

  // 9) المحادثة
  phone('r3', 'المحادثة', 'بطاقة الموعد وبطاقة الطلب داخل المحادثة', false,
    '<div class="body" style="padding-bottom:6px"><div class="top"><div class="li" style="border:0;padding:0"><span class="back">›</span><span class="logo r" style="background:#E46A8B;width:34px;height:34px">ن</span><div><b>نورة</b><small style="color:var(--a-green)">متصلة الآن</small></div></div></div>' +

    '<div class="mcard"><div class="between"><b>🤝 موعد</b><span class="pill p-y">بانتظارك</span></div><div class="ttl">الخميس 13 نوفمبر · 7:00 م</div><div class="mut sm">📍 ' + brew.name + ' · ' + brew.address.split('،')[0] + '</div><div class="grid2"><div class="btn sm">أوافق</div><div class="btn sm line">اقترح غيره</div></div></div>' +
    '<div class="bub you">وأرسلت لك تذكرة الجاز 🎷</div>' +
    '<div class="mcard"><div class="between"><b>🎟 تذكرة هدية</b><span class="pill p-g">سارية</span></div><div class="ttl">ليلة جاز في البلد</div><div class="mut sm">الخميس 9:00 م · من نورة</div><div class="btn sm ghost">أضفها إلى تذاكري</div></div>' +
    '<div class="bub me">يا سلام 😍 شكراً</div></div></div>' +
    '<div class="composer"><span class="back">＋</span><div class="field">اكتب رسالة…</div><span class="send">➤</span></div>');

  // 10) ملفي
  phone('r3', 'ملفي كما يراه الناس', 'حساب حقيقي وإعلاناته', true,
    '<div class="body"><div class="top"><span class="back">›</span><span class="back">⋯</span></div><div style="display:grid;justify-items:center;gap:4px;text-align:center"><img class="logo r" style="width:72px;height:72px" src="' + ME.avatar + '" alt=""><b style="font-size:16px">' + ME.nick + '</b><span class="mut sm">@' + ME.nick + ' · جدة</span></div>' +
    '<div class="grid2" style="grid-template-columns:1fr 1fr 1fr"><div class="stat"><b>' + ME.listings.length + '</b><span class="mut sm">إعلانات</span></div><div class="stat"><b>—</b><span class="mut sm">متابِعون</span></div><div class="stat"><b>—</b><span class="mut sm">يتابع</span></div></div>' +
    '<div class="grid2"><div class="btn">تابع</div><div class="btn ghost">راسله</div></div>' +
    '<div class="hs"><span class="chip on">الكل</span><span class="chip">لحظات</span><span class="chip">للبيع</span><span class="chip">دوائره</span></div>' +
    '<div class="grid2">' + ME.listings.map(function (x) { return '<div class="g"><img src="' + x.img + '" alt=""><b>' + x.title + '</b><span>' + (x.price ? sar(x.price) : 'مطلوب') + '</span></div>'; }).join('') + '</div></div>');

  // 11) الإشعارات
  var ns = [['🛍', 'a-green-soft', 'تم قبول طلبك', L[0].title + ' · التسليم اليوم', 'الآن', 1], ['⭐', 'a-yellow-soft', 'عرض جديد من ' + brew.name, 'للأعضاء فقط حتى 7 م', 'قبل 20 د', 1], ['🤝', 'a-blue-soft', 'نورة اقترحت موعداً', 'الخميس 7:00 م', 'قبل ساعة', 0], ['🎟', 'a-red-soft', 'تذكير: ليلة جاز في البلد', 'تبدأ بعد ساعة', 'أمس', 0], ['💼', 'a-blue-soft', 'فرصة تناسب ملفك', 'باريستا دوام جزئي', 'أمس', 0], ['👤', 'a-soft', 'خالد بدأ يتابعك', '', 'قبل يومين', 0]];
  phone('r3', 'الإشعارات', 'لون الأيقونة يدل على النوع', false,
    '<div class="body"><div class="top"><b>الإشعارات</b><span class="sm" style="color:var(--a-blue);font-weight:700">قراءة الكل</span></div><div class="hs"><span class="chip on">الكل</span><span class="chip">طلباتي</span><span class="chip">دوائري</span><span class="chip">أصحابي</span></div><div>' +
    ns.map(function (n) { return '<div class="li"><span class="ic" style="background:var(--' + n[1] + ')">' + n[0] + '</span><div><b>' + n[2] + '</b><small>' + (n[3] || ' ') + '</small></div><span class="mut sm">' + n[4] + '</span>' + (n[5] ? '<span style="width:8px;height:8px;border-radius:50%;background:var(--a-blue);flex:none"></span>' : '') + '</div>'; }).join('') + '</div></div>' + nav(-1));

  // 12) الإعدادات
  function set(ic, bg, t, s, r) { return '<div class="li"><span class="ic" style="background:var(--' + bg + ')">' + ic + '</span><div><b>' + t + '</b><small>' + s + '</small></div>' + r + '</div>'; }
  phone('r3', 'الإعدادات والخصوصية', 'اختيارات قليلة ومؤثرة', false,
    '<div class="body"><div class="top"><span class="back">›</span><b>الإعدادات</b><span style="width:30px"></span></div>' +
    '<div class="sect">ما أراه</div><div>' + set('✨', 'a-blue-soft', 'اهتماماتي', 'قهوة، تسوق، فعاليات، عمل حر', '<span class="mut">‹</span>') + set('🚫', 'a-soft', 'ما أخفيته', '3 أنواع لا تظهر في «لك»', '<span class="mut">‹</span>') + '</div>' +
    '<div class="sect">من يراني</div><div>' + set('👁', 'a-green-soft', 'ملفي عام', 'يراه الجميع', '<span class="tog on"></span>') + set('💬', 'a-blue-soft', 'من يراسلني', 'أصحابي ودوائري', '<span class="mut">‹</span>') + set('📍', 'a-red-soft', 'مشاركة موقعي مع أصحابي', 'مطفأة', '<span class="tog"></span>') + '</div>' +
    '<div class="sect">التنبيهات</div><div>' + set('🔔', 'a-yellow-soft', 'ملخص المساء', 'إشعار واحد يجمع الجديد', '<span class="tog on"></span>') + set('⭐', 'a-yellow-soft', 'عروض دوائري', 'كل العروض', '<span class="mut">‹</span>') + '</div>' +
    '<div class="sect">الحساب</div><div>' + set('🔒', 'a-soft', 'البريد وكلمة السر', '', '<span class="mut">‹</span>') + set('💼', 'a-blue-soft', 'افتح دائرتك', 'لتظهر لك «مكتبي»', '<span class="mut">‹</span>') + '</div></div>');
})();
</script>
